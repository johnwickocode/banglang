[package]
name = "bangla_ffi"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = false

[profile.release]
debug = false
codegen-units = 1

[lib]
name = "bangla_ffi"
# Tells Rust to compile this as a C-compatible dynamic or static library
crate-type = ["cdylib", "staticlib"]

[dependencies]
cc = "1.11.2"
